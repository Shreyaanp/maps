name: Release to Google Play

# Publishes when you push a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Required repository secrets:
#   KEYSTORE_BASE64           - upload keystore, base64-encoded
#   KEYSTORE_PASSWORD         - keystore password
#   KEY_ALIAS                 - key alias
#   KEY_PASSWORD              - key password
#   PLAY_SERVICE_ACCOUNT_JSON - Google Cloud service account JSON with
#                               release access in the Play Console

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundles (phone + wear)
        run: ./gradlew :app:bundleRelease :wear:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload phone app to Play (internal testing track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: work.shreyaan.dwell
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      # The wear track only exists after the Wear OS form factor is enabled
      # for the app in the Play Console. If this step fails with an unknown
      # track error, enable Wear OS in Console first; the exact track name
      # can be listed via the Play Developer API tracks.list.
      - name: Upload wear app to Play (wear internal track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: work.shreyaan.dwell
          releaseFiles: wear/build/outputs/bundle/release/wear-release.aab
          track: "wear:internal"
          status: completed
